name: CI/CD Pipeline - Desafio DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ETAPA 1: Integração Contínua (CI) - Testes
  build-and-test:
    name: Build e Testes (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução para o Maven Wrapper
        run: chmod +x mvnw

      - name: Executar Testes Automatizados
        run: ./mvnw test

  # ETAPA 2: Continuous Deployment (CD) - Staging
  deploy-staging:
    name: Deploy em Staging
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Build da Imagem Docker (Staging)
        run: docker build -t desafiodevops:staging .

      - name: Simulação de Deploy no Servidor de Staging
        run: echo "🚀 Deploy realizado com sucesso no ambiente de STAGING!"

  # ETAPA 3: Continuous Deployment (CD) - Produção
  deploy-production:
    name: Deploy em Produção
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Build da Imagem Docker (Produção)
        run: docker build -t desafiodevops:latest .

      - name: Simulação de Deploy no Servidor de Produção
        run: echo "🚀 Deploy realizado com sucesso no ambiente de PRODUÇÃO!"